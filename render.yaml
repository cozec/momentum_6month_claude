# Render Blueprint — deploys ONLY the dashboard web service.
#
# Render's Free plan does not include cron jobs, so the monthly email
# runs from GitHub Actions instead — see ``.github/workflows/monthly-
# picks-email.yml`` and the README's "One-click deploy" section.
#
# How to deploy the dashboard:
#   1. https://dashboard.render.com → New → Blueprint → connect this repo.
#   2. Render reads this file and creates the web service on the Free plan.
#   3. Free plan sleeps after 15 min idle — first request after sleep
#      takes ~30s wake + ~25s yfinance refresh; cached requests are < 1 s.

services:
  - type: web
    name: momentum-web
    runtime: python
    plan: free
    rootDir: nasdaq100_momentum_backtest
    buildCommand: pip install -r requirements.txt
    startCommand: python run_webapp.py
    # ``/health`` is a cheap probe that doesn't run a backtest;
    # ``/api/picks`` would fire 100 yfinance downloads on a cold
    # deploy and risk tripping Render's health-check timeout.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MOMENTUM_HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
