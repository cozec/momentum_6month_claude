name: Month-end report and picks email

# Runs every evening from the 26th to the 31st at 22:30 UTC (6:30 pm EDT /
# 5:30 pm EST, after the US close settles) and does real work only on the
# month's last NYSE trading day — the close that locks next month's picks.
# Cron can't express "last trading day", hence the daily window plus the
# calendar check. Everything runs on the runner (no hosted backend):
#   1. start the Nasdaq-100 dashboard locally and refresh prices,
#   2. snapshot it into report.html,
#   3. run Titan-12 month-end (titan12_sp500_momentum/scripts/month_end.py),
#      which snapshots the dashboard's picks and rebuilds its own report,
#   4. commit both reports, deploy GitHub Pages,
#   5. send one email covering both strategies with links to the reports.
# A Titan-12 or publish failure must not cost the Nasdaq-100 email: the email
# step always runs and says so when Titan-12's section is missing.
# The manual trigger always runs (FORCE_SEND) for smoke tests.
on:
  schedule:
    - cron: "30 22 26-31 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: month-end
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    defaults:
      run:
        working-directory: nasdaq100_momentum_backtest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nasdaq100_momentum_backtest/src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Last NYSE trading day of the month?
        id: gate
        run: |
          python - <<'EOF'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas as pd
          from src.nyse_calendar import first_session_on_or_after, last_session_before

          # The cron fires at 18:30 ET; the 6-hour offset keeps a run GitHub
          # starts late, even past midnight, on its scheduled date.
          now = datetime.now(ZoneInfo("America/New_York")) - pd.Timedelta(hours=6)
          today = pd.Timestamp(now.date())
          next_entry = first_session_on_or_after(today + pd.offsets.MonthBegin(1))
          last = last_session_before(next_entry)
          run = today == last or "${{ github.event_name }}" == "workflow_dispatch"
          print(f"today={today.date()} last session={last.date()} run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          EOF

  month-end:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: nasdaq100_momentum_backtest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            nasdaq100_momentum_backtest/requirements.txt
            titan12_sp500_momentum/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r ../titan12_sp500_momentum/requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start dashboard and refresh prices
        run: |
          nohup python run_webapp.py > webapp.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/health && break; sleep 2; done
          curl -sf --max-time 2400 "http://127.0.0.1:8765/api/dashboard?refresh=true" > /dev/null
          tail -5 webapp.log

      - name: Build report.html
        run: python scripts/build_report.py ../report.html

      - name: Titan-12 month-end
        continue-on-error: true
        working-directory: titan12_sp500_momentum
        run: >-
          python scripts/month_end.py
          ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          --email-json ${{ github.workspace }}/titan12_email.json

      - name: Commit reports
        working-directory: .
        run: |
          git config user.name "Adam Wang"
          git config user.email "yadongwang@gmail.com"
          git add report.html titan12_sp500_momentum/report.html
          git diff --cached --quiet || git commit -m "Month-end report snapshot $(TZ=America/New_York date +%F)"
          # Refreshed price CSVs stay uncommitted, hence the autostash.
          git pull --rebase --autostash origin main
          git push

      - name: Stage site
        working-directory: .
        run: |
          mkdir -p _site/titan12
          cp index.html report.html rebalance_example.html _site/
          cp titan12_sp500_momentum/report.html _site/titan12/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Send picks email
        if: ${{ !cancelled() }}
        env:
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          MOMENTUM_API_BASE: http://127.0.0.1:8765
          REPORT_URL:        https://cozec.github.io/momentum_6month_claude/report.html
          TITAN_EMAIL_JSON:  ${{ github.workspace }}/titan12_email.json
          FORCE_SEND:        ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          PYTHONUNBUFFERED:  "1"
        run: python send_picks_email.py
