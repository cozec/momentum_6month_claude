name: Monthly picks email

# Runs every evening from the 26th to the 31st at 22:30 UTC (6:30 pm EDT /
# 5:30 pm EST, after the US close settles). send_picks_email.py only sends
# on the month's last NYSE trading day — the close that locks next month's
# picks — so the trades arrive in time for market-on-close orders on the
# first trading day. Cron can't express "last trading day", hence the
# daily window plus the in-script check. The manual trigger always sends
# (FORCE_SEND) for smoke tests.
on:
  schedule:
    - cron: "30 22 26-31 * *"
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send picks email
        working-directory: nasdaq100_momentum_backtest
        env:
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          MOMENTUM_API_BASE: ${{ secrets.MOMENTUM_API_BASE }}
          REFRESH:           "1"
          FORCE_SEND:        ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # Render Free plan sleeps after 15 min idle. First request
          # takes ~30 s wake + the price refresh → keep the timeout
          # generous so the wake doesn't trip exit 1.
          HTTP_TIMEOUT:      "240"
          PYTHONUNBUFFERED:  "1"
        run: python send_picks_email.py
