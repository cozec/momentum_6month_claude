name: Deploy report to GitHub Pages

# Publish only the static pages, not the whole repo (price CSVs etc.).
on:
  push:
    branches: [main]
    paths:
      - index.html
      - report.html
      - rebalance_example.html
      - titan12_sp500_momentum/report.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            report.html
            rebalance_example.html
            titan12_sp500_momentum/report.html
          sparse-checkout-cone-mode: false
      - name: Stage site
        run: |
          mkdir -p _site/titan12
          cp index.html report.html rebalance_example.html _site/
          cp titan12_sp500_momentum/report.html _site/titan12/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
